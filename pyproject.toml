[project]
name = "obsidian-rag"
version = "0.1.0"
description = "Local retrieval over Markdown notes."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2,<3",
    "ollama>=0.6,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"
